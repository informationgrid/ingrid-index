# Builds resolved JSON schemas and HTML documentation and publishes them to
# the "releases" branch under a folder named after the version
# (e.g. releases:8.4.0/schema/*.json, releases:8.4.0/*.html).
#
# Three triggers:
#   - Push to "draft" that touches src/ or scripts/: rebuilds the "draft"
#     version, overwriting releases:draft/.
#   - Push (or force-push) of a "v*" tag (e.g. v8.4.0): builds that specific
#     version, overwriting releases:8.4.0/. Path filters don't apply to tag
#     pushes, so this always runs.
#   - Deletion of a "v*" tag (e.g. v8.4.0): removes that version's folder
#     from the "releases" branch.
#
# Runs are serialized (concurrency group) so overlapping pushes don't race
# when publishing to "releases".
#
# Release flow:
#   1. On the "draft" branch, tag the commit as "v<version>" (e.g. v8.4.0)
#      and push the tag. This triggers a build for that version.
#
# To rebuild an older version (e.g. to fix a published schema):
#   1. Create a support branch for that version (if it doesn't exist yet)
#      and commit the fix there.
#   2. Force-move the existing tag to the tip of the support branch and
#      push it. This re-triggers the workflow, which overwrites that
#      version's folder on the "releases" branch.
#
# To remove a published version:
#   1. Delete the "v<version>" tag (locally and on origin), e.g.:
#      git tag -d v8.4.0 && git push origin :refs/tags/v8.4.0
#   2. This triggers the "remove" job, which deletes the "8.4.0/" folder
#      from the "releases" branch and regenerates the root index.html.

name: Build Schemas & Docs

on:
  push:
    branches:
      - draft
    paths:
      - "src/**"
      - "scripts/**"
    tags:
      - "v*" # e.g. v1.0.0, v8.4.0
  delete:

permissions:
  contents: write

# Serialize runs so concurrent pushes (e.g. a "draft" push and a tag push)
# don't race when publishing to "releases".
concurrency:
  group: releases-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Node.js ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      # ── Python ─────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install json-schema-for-humans pyyaml

      # ── Determine version ──────────────────────────────────────
      # A "v*" tag (e.g. v8.4.0) builds that version; a push to "draft"
      # builds the "draft" version.
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=draft" >> "$GITHUB_OUTPUT"
          fi

      # ── Build ──────────────────────────────────────────────────
      # Resolve all $ref → dist/<version>/schema/*.json
      - name: Build resolved schemas
        run: node scripts/build_schemas.js --version ${{ steps.version.outputs.version }}

      # Generate HTML documentation → dist/<version>/*.html
      - name: Build documentation
        run: python scripts/build_docs.py --version ${{ steps.version.outputs.version }}

      # ── Publish to the "releases" branch ──────────────────────
      # The "releases" branch contains only one folder per version
      # (e.g. 8.4.0/, 8.5.0/). Rebuilding a version overwrites its folder.
      - name: Publish to releases branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin releases > /dev/null; then
            git fetch origin releases
            git worktree add ../releases-branch origin/releases
            cd ../releases-branch
            git switch -c releases
          else
            git worktree add --detach ../releases-branch
            cd ../releases-branch
            git checkout --orphan releases
            git rm -rf . > /dev/null
          fi

          rm -rf "$VERSION"
          mkdir -p "$VERSION"
          cp -r "$GITHUB_WORKSPACE/dist/$VERSION/." "$VERSION/"

          # Regenerate the root index.html, linking to each version's
          # index.html.
          python "$GITHUB_WORKSPACE/scripts/build_releases_index.py" .

          git add "$VERSION" index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "release: $VERSION"
          git push origin releases

  remove:
    if: github.event_name == 'delete' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Remove the version from the "releases" branch ──────────
      - name: Remove version from releases branch
        env:
          TAG: ${{ github.event.ref }}
        run: |
          VERSION="${TAG#v}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin releases
          git worktree add ../releases-branch origin/releases
          cd ../releases-branch
          git switch -c releases

          if [ ! -d "$VERSION" ]; then
            echo "No '$VERSION' folder on releases branch, nothing to remove"
            exit 0
          fi

          git rm -rf "$VERSION" > /dev/null

          # Regenerate the root index.html, linking to each version's
          # index.html.
          python "$GITHUB_WORKSPACE/scripts/build_releases_index.py" .

          git add index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "release: remove $VERSION"
          git push origin releases
