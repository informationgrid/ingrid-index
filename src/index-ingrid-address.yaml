$schema: https://json-schema.org/draft/2020-12/schema
title: InGrid Index - Adresse
description: |
  Dies ist das JSON-Schema für Adressen (Personen und Organisationen) im InGrid-Index.

  Adressen nutzen die "Root fields", die für Metadatensätze entworfen sind. Wie ein Feld bei Adressen
  befüllt wird, steht am Feld im Teil "Address"; Felder ohne Angabe dort werden wie beschrieben
  verwendet (z. B. `title`). Anschrift und Kommunikation der Adresse stehen in `contacts` im Eintrag mit
  `role` `self`; Angaben ohne Gegenstück in den "Root fields" in `address`.

  Nicht befüllt werden `description`, `language`, `spatials`, `crs`, `temporal`, `keywords` und
  `references`.

  ISO 19139:2007: Eine Adresse entspricht einem `gmd:CI_ResponsibleParty`. Die Pfade nennen es unter
  `gmd:identificationInfo/*/gmd:pointOfContact`; sie gelten ebenso für jedes andere
  `gmd:CI_ResponsibleParty` eines Metadatensatzes (z. B. `gmd:contact`).

type: object
unevaluatedProperties: false
allOf:
  - $ref: ./parts/core.yaml
  - $ref: "#/$defs/Address"
$defs:
  Address:
    type: object
    title: Address
    required: [ contacts ]
    if:
      properties:
        metadata:
          properties:
            document_type:
              const: InGridPersonDoc
          required: [ document_type ]
      required: [ metadata ]
    then:
      required: [ address ]
      properties:
        address:
          required: [ last_name ]
    else:
      properties:
        address:
          properties:
            salutation: false
            academic_title: false
            first_name: false
            last_name: false
            hide_address: false
    properties:
      id:
        x-transform:
          iso19139-2007: |
            # Lesen & schreiben

            `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty/@uuid`
      title:
        x-transform:
          iso19139-2007: |
            # Lesen & schreiben

            `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty/(gmd:organisationName | gmd:individualName)/gco:CharacterString`

            ## Mapping (logic)

            - `metadata.document_type` `InGridOrganisationDoc` ↔ `gmd:organisationName`
            - `metadata.document_type` `InGridPersonDoc` ↔ `gmd:individualName`

            > Schreiben bei Personen: aus `address.last_name`, `address.first_name` und
            > `address.academic_title` (siehe dort), nur ohne diese Angaben aus `title`.
      metadata:
        description: Angaben zur Adresse statt zum Metadatensatz.
        properties:
          data_type:
            description: "UNKLAR: Der Wert für Adressen ist noch festzulegen."
          created:
            description: Erstellungsdatum der Adresse. ISO 8601 Format.
          document_type:
            type: string
            description: "Beschreibt, ob die Adresse eine Person oder eine Organisation ist."
            enum:
              - InGridPersonDoc
              - InGridOrganisationDoc
            x-transform:
              iso19139-2007: |
                # Lesen

                `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty/gmd:individualName`

                ## Mapping (logic)

                - `InGridPersonDoc` ← mit `gmd:individualName`
                - `InGridOrganisationDoc` ← ohne `gmd:individualName`

                # Schreiben

                Wird nicht als eigenes Element geschrieben; bestimmt, ob `title` als `gmd:individualName` oder
                `gmd:organisationName` geschrieben wird.
          modified:
            description: Änderungsdatum der Adresse. ISO 8601 Format.
            x-transform:
              iso19139-2007: |
                Kein Gegenstück in ISO 19139:2007. `gmd:CI_ResponsibleParty` enthält kein Änderungsdatum.
      contacts:
        description: |
          Anschrift und Kommunikation der Adresse selbst stehen in genau einem Eintrag mit `role` `self`
          (Pflicht).
        x-transform:
          iso19139-2007: |
            # Lesen & schreiben

            `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty`

            ## Mapping (logic)

            - der Eintrag mit `role` `self` ↔ das `gmd:CI_ResponsibleParty` der Adresse

            > Die übrigen Unterfelder bilden auf dieselben Elemente ab wie bei Metadatensätzen.
        contains:
          properties:
            role:
              const: self
            communications:
              contains:
                properties:
                  type:
                    const: email
                  value:
                    minLength: 1
                required: [ type, value ]
          required: [ role, administrative_area, communications ]
        items:
          properties:
            role:
              description: "`self` für den Eintrag der Adresse selbst."
              x-transform:
                iso19139-2007: |
                  Kein Gegenstück in ISO 19139:2007. Der Eintrag der Adresse hat immer `role` `self`;
                  `gmd:role` ist die Rolle, in der ein Metadatensatz auf die Adresse verweist, und gehört nicht zur
                  Adresse.
            name:
              description: Im Eintrag `self` wie `title`.
            street:
              title: Straße/Hausnummer
              description: |
                Hausadresse der Zentrale bzw. des Hauptgebäudes. Pflicht, sofern kein Postfach angegeben ist.
              $comment: 'InGrid-Domain 381'
              examples:
                - Meyersgrund 14
            code:
              title: PLZ
              description: Postleitzahl der Hausadresse (`street`).
              $comment: 'InGrid-Domain 384'
              examples:
                - '30169'
            pobox:
              title: Postfach
              description: Nummer des Postfachs. Pflicht, sofern keine Hausadresse angegeben ist.
              $comment: 'InGrid-Domain 381'
              examples:
                - '30151'
            pocode:
              title: PLZ (Postfach)
              description: Postleitzahl des Postfachs (`pobox`).
              $comment: 'InGrid-Domain 384'
              examples:
                - '8977'
            locality:
              title: Ort
              description: |
                Ort der Zentrale bzw. des Hauptgebäudes. Unterscheidet sich der Ort von Haus- und Postadresse,
                wird nur eine der beiden Adressen vollständig angegeben.
              $comment: 'InGrid-Domain 382'
              examples:
                - Bruchsal
            administrative_area:
              title: Verwaltungsgebiet
              description: |
                Wert der InGrid-Codeliste 6250, z. B. ein Bundesland. Dient der Recherche nach Ressourcen eines
                bestimmten Bundeslandes. Pflicht im Eintrag `self`.
              examples:
                - Niedersachsen
            country:
              title: Staat
              description: Wert der InGrid-Codeliste 6200.
              examples:
                - Deutschland
            communications:
              title: Kommunikation
              description: |
                Alle Kommunikationsmittel außer der Post. `type` nach InGrid-Codeliste 4430: `E-Mail` → `email`,
                `Telefon` → `phone`, `Fax` → `fax`, `URL` → `website`, andere → `other`. `value` ist die
                zugehörige Verbindung (E-Mail-Adresse, Telefon- oder Faxnummer, URL). Pflicht ist im Eintrag
                `self` mindestens ein Eintrag mit `type` `email` und `value` (INSPIRE).
      address:
        type: object
        description: |
          Angaben zur Adresse ohne Gegenstück in den "Root fields". `salutation`, `academic_title`,
          `first_name`, `last_name` und `hide_address` nur bei `InGridPersonDoc`; dort ist `last_name` Pflicht.
        properties:
          position_name:
            type: string
            title: Aufgaben
            description: |
              Angabe der Zuständigkeiten und Aufgaben einer Institution. In knapper, aussagekräftiger Form
              sollen die Aufgaben und Zuständigkeiten der eingetragenen Institution dargestellt werden.
            $comment: 'InGrid-Domain 377'
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty/gmd:positionName/gco:CharacterString`

                > Position oder Funktion der zuständigen Person.
            examples:
              - Erarbeitung von fachlichen Grundlagen für Entscheidungen der Bezirksregierungen im Bereich des Naturschutzes sowie Erstellung von Gutachten in besonderen Fällen gemäß NNatG
          hours_of_service:
            type: string
            title: Servicezeiten
            description: |
              Zeitraum inklusive der Zeitzone, wann die verantwortliche Person oder Organisation erreicht werden
              kann.
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty/gmd:contactInfo/gmd:CI_Contact/gmd:hoursOfService/gco:CharacterString`
          salutation:
            title: Anrede
            description: |
              Anrede der Person, um eine korrekte Korrespondenz zu ermöglichen. Hier wird die Codeliste 4300
              verwendet (`1` Frau, `2` Herr); freie Einträge (z. B. Mrs, Mr) sind möglich, dann ist `key` `null`.
            $ref: ./parts/shared-types.yaml#/$defs/KeyValue
            x-transform:
              iso19139-2007: |
                Kein Gegenstück in ISO 19139:2007.
            examples:
              - 1 - Frau
          academic_title:
            title: Titel
            description: |
              Dem Namen vorangestellter akademischer Titel der Person. Hier wird die Codeliste 4305 verwendet
              (`1` Dr., `2` Prof., `3` Prof. Dr.). Amtstitel (z. B. MinD, OAR) werden aus Datenschutzgründen
              nicht angegeben.
            $ref: ./parts/shared-types.yaml#/$defs/KeyValue
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty/gmd:individualName/gco:CharacterString`

                ## Mapping (logic)

                - `value` ↔ dritter Teil des Namens (siehe `address.last_name`)
                - `key` ← ID des Eintrags der InGrid-Codeliste 4305 zum Wert, sonst `null`
            examples:
              - 3 - Prof. Dr.
          first_name:
            type: string
            title: Vorname
            description: |
              Vorname der Person, um Verwechslungen von Trägern gleicher Nachnamen zu vermeiden. Auf
              Vollständigkeit der Vornamen wird kein Wert gelegt.
            $comment: 'InGrid-Domain 374'
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty/gmd:individualName/gco:CharacterString`

                > Zweiter Teil des Namens (siehe `address.last_name`).
            examples:
              - Rosemarie
          last_name:
            type: string
            title: Name
            description: |
              Vollständiger Nachname der Person.
            $comment: 'InGrid-Domain 374'
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:pointOfContact/gmd:CI_ResponsibleParty/gmd:individualName/gco:CharacterString`

                ## Mapping (logic)

                - `<last_name>, <first_name>, <academic_title.value>` ↔ Text von `gmd:individualName`

                > Schreiben: fehlende Teile entfallen samt Trennzeichen. Lesen: Aufteilung am Komma; ohne Komma
                > gilt der ganze Text als `last_name`. UNKLAR: Das Trennzeichen ist abzustimmen; fehlt ein
                > mittlerer Teil, ist die Aufteilung nicht eindeutig.
            examples:
              - vom Busche
          hide_address:
            type: boolean
            title: Adresse verbergen
            description: |
              Bei `true` werden für die Anzeige die Daten der übergeordneten Organisation verwendet statt die der
              Person.
            x-transform:
              iso19139-2007: |
                Kein Gegenstück in ISO 19139:2007. 

                > Wenn `true` dann werden die Daten der übergeordneten Organisation verwendet; das Indexformat
                > enthält nur den Verweis darauf (`address.cross_references`), nicht ihre Daten.
          cross_references:
            type: array
            title: Verknüpfungen
            description: |
              Interne InGrid-Verknüpfungen der Adresse:

              * Übergeordnete Adresse: ein Eintrag mit `direction` `OUT`, ohne `reference_type`.
              * Zugeordnete Datensätze (Datensätze, die die Adresse verwenden): je Datensatz ein Eintrag mit
                `direction` `IN`; `reference_type` ist die Rolle, in der der Datensatz die Adresse verwendet
                (z. B. `pointOfContact`).
            x-transform:
              iso19139-2007: |
                Kein Gegenstück in ISO 19139:2007. Interne InGrid-Verknüpfungen.
            items:
              $ref: ./parts/shared-types.yaml#/$defs/CrossReference
