$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.com/schemas/1.0.0/dcat.yaml
title: InGrid Index - InGrid
description: |
  Dies ist das JSON-Schema für den InGrid-Index.
  Folgende Anmerkungen zu den "Root fields":
  
  * references[].type kann die folgenden Werte enthalten
    * Codeliste 2000
    * previewGraphic

type: object
unevaluatedProperties: false
allOf:
  - $ref: ./parts/core.yaml
  - $ref: "#/$defs/InGrid"
$defs:
  InGrid:
    type: object
    title: InGrid
    properties:
      metadata:
        type: object
        description: "Enthält zusätzliche Metadaten zum Datensatz."
        unevaluatedProperties: false
        allOf:
          - $ref: ./parts/core.yaml#/$defs/Metadata
          - type: object
            title: InGrid Metadata
            properties:
              data_type:
                type: string
                enum:
                  - INGRID
                  - UMWELTNAVI
                x-transform:
                  iso19139-2007: |
                    Kein Gegenstück in ISO 19139:2007. Konstant `INGRID`.
              document_type:
                type: string
                description: "Beschreibt den Typ des Metadatensatzes."
                x-transform:
                  iso19139-2007: |
                    # Lesen & schreiben

                    `gmd:hierarchyLevel/gmd:MD_ScopeCode/@codeListValue`

                    ## Mapping (lookup)

                    - `InGridGeoDataset` ↔ `dataset` (lesen auch `series` und ohne Angabe)
                    - `InGridGeoService` ↔ `service`
                    - `InGridInformationSystem` ↔ `application`
                    - `InGridSpecialisedTask` ↔ `nonGeographicDataset` mit `gmd:hierarchyLevelName` `job`
                    - `InGridPublication` ↔ `nonGeographicDataset` mit `gmd:hierarchyLevelName` `document`
                    - `InGridProject` ↔ `nonGeographicDataset` mit `gmd:hierarchyLevelName` `project`
                    - `InGridDataCollection` ↔ `nonGeographicDataset` mit `gmd:hierarchyLevelName` `database`

                    > Lesen: `nonGeographicDataset` mit anderem `gmd:hierarchyLevelName` → `InGridGeoDataset`.
                    > Schreiben: `series` lässt sich nicht unterscheiden und wird `dataset`.
              language:
                type: string
                description: Enthält die Sprache des Metadatensatzes. Hier wird die Codeliste 99999999 verwendet.
              partner:
                type: string
                description: Der Partner der Datenquelle als Kürzel. Siehe auch Codeliste 110.
              provider:
                type: string
                description: Der Anbieter der Datenquelle als Kürzel. Dieser wird aus der Codeliste 111 genommen.
                examples:
                  - ni_gll
            if:
              properties:
                data_type:
                  const: "INGRID"
              required: [ data_type ]
            then:
              properties:
                document_type:
                  enum:
                    - InGridGeoDataset
                    - InGridDataCollection
                    - InGridGeoService
                    - InGridInformationSystem
                    - InGridPublication
                    - InGridProject
                    - InGridSpecialisedTask
            required:
              - data_type

      # - Aktualität des Datensatzes
      #   - Status (temporal.status)
      #   - Pflegeintervall (temporal.maintenanceFrequency)
      #   - Benutzerdefiniertes Pflegeintervall (temporal.userDefinedMaintenanceFrequency)
      temporal:
        type: object
        description: "Enthält zusätzliche Informationen zur Aktualität des Datensatzes, einschließlich Status, Pflegeintervall und benutzerdefinierten Pflegeintervall."
        unevaluatedProperties: false
        allOf:
          - $ref: ./parts/shared-types.yaml#/$defs/Temporal
          - type: object
            title: InGrid Temporal
            properties:
              status:
                $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                description: "In welchem Zustand ist der Datensatz? Hier wird die Codeliste 523 verwendet."
                x-transform:
                  iso19139-2007: |
                    # Lesen & schreiben

                    `gmd:identificationInfo/*/gmd:status/gmd:MD_ProgressCode/@codeListValue`

                    ## Mapping (logic)

                    - `value` ↔ Code
                    - `key` ← ID des Eintrags der InGrid-Codeliste 523 zum Code
                  dcat-ap: |
                    Kein Gegenstück in DCAT-AP.
                examples:
                  - 1 - abgeschlossen
                  - 2 - historisches Archiv
              maintenance_frequency:
                $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                description: "Enthält das Pflegeintervall des Datensatzes. Es wird die Codeliste 518 verwendet."
                x-transform:
                  iso19139-2007: |
                    # Lesen & schreiben

                    `gmd:identificationInfo/*/gmd:resourceMaintenance/gmd:MD_MaintenanceInformation/gmd:maintenanceAndUpdateFrequency/gmd:MD_MaintenanceFrequencyCode/@codeListValue`

                    ## Mapping (logic)

                    - `value` ↔ Code
                    - `key` ← ID des Eintrags der InGrid-Codeliste 518 zum Code
                  dcat-ap: |
                    # Lesen & schreiben

                    `dct:accrualPeriodicity`

                    ## Mapping (lookup)

                    `value` ↔ letzter Pfadabschnitt der IRI aus
                    `http://publications.europa.eu/resource/authority/frequency/`:

                    - `continual` ↔ `UPDATE_CONT` (lesen auch `CONT`)
                    - `daily` ↔ `DAILY`
                    - `weekly` ↔ `WEEKLY`
                    - `fortnightly` ↔ `BIWEEKLY`
                    - `monthly` ↔ `MONTHLY`
                    - `quarterly` ↔ `QUARTERLY`
                    - `biannually` ↔ `ANNUAL_2`
                    - `annually` ↔ `ANNUAL`
                    - `irregular` ↔ `IRREG`
                    - `notPlanned` ↔ `NEVER`
                    - `unknown` ↔ `UNKNOWN`

                    > Lesen: `key` = ID des Eintrags der InGrid-Codeliste 518 zum Wert.
                examples:
                  - 2 - täglich
                  - 3 - wöchentlich
                  - 5 - monatlich
              user_defined_maintenance_frequency_in_sec:
                type: string
                description: "Enthält das benutzerdefinierte Pflegeintervall des Datensatzes in Sekunden."
                x-transform:
                  iso19139-2007: |
                    # Lesen & schreiben

                    `gmd:identificationInfo/*/gmd:resourceMaintenance/gmd:MD_MaintenanceInformation/gmd:userDefinedMaintenanceFrequency/gts:TM_PeriodDuration`

                    ## Mapping (logic)

                    - Sekunden ↔ ISO-8601-Dauer (z. B. `P1D` = 86400; geschrieben als `PT<n>S`)
                  dcat-ap: |
                    Kein Gegenstück in DCAT-AP.
                examples:
                  - 60
      exports:
        unevaluatedProperties: true
        properties:
          iso:
            type: string
            description: "Enthält das vollständige ISO-19139-Dokument im XML-Format."
            x-transform:
              iso19139-2007: |
                # Lesen

                `.`

                > Der vollständige Quelldatensatz (`gmd:MD_Metadata`) als XML-String.

                # Schreiben

                Wird nicht geschrieben; das ISO-Dokument entsteht aus den übrigen Feldern.
              dcat-ap: |
                Kein Gegenstück in DCAT-AP. Nur bei Datensätzen im Format ISO 19139:2007.

      ingrid:
        properties:

          # portal specific

          # CORE

          # - Titel (c)
          # - Tags, wie OpenData (c)
          # - ansprechpartner (c)
          #   - Erstellung (c)
          #   - Publikation (c)
          #   - Letzte Änderung (c)
          # - Raumbezug (c)
          # - Koordinatensystem (c)
          # - Kontakte (c)
          # - Schlagworte (c)
          #   - UUID (c)
          #   - Aktualität (c?)

          # PROFILE

          # Kurzbezeichnung
          alternate_title:
            type: string
            description: "Ermöglicht das Setzen eines alternativen Titels oder eine Kurzbeschreibung des Datensatzes."
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:citation/gmd:CI_Citation/gmd:alternateTitle/gco:CharacterString`

                > Lesen: alle Vorkommen, mit Leerzeichen verbunden. Schreiben: als ein `gmd:alternateTitle`.
              dcat-ap: |
                # Lesen & schreiben

                `dct:alternative`

          # - Typ (metadata.type)
          # - Informationen zum Metadatensatz
          #   - Sprache
          #   - Datensatz/serie
          #   - ISO-XML - Link (im Portal generiert - CSW-Schnittstelle)
          #   - Ansprechpartner (Metadatum)
          #   - Quelle


          # - downloads (references)
          # - vorschaubilder (references)
          # - Verweise und Downloads (references)

          # - nutzungsbedingungen (licenses)
          # - Nutzungsbedingungen (licenses)
          # - Anwendungseinschränkungen (licenses)
          # access- and use-constraints and use limitations
          licenses:
            type: array
            description: "Liste der Nutzungsbedingungen oder Einschränkungen für die Verwendung der externen Ressource oder Download."
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:resourceConstraints`

                ## Mapping (logic)

                - `useLimitations` ↔ `gmd:MD_Constraints/gmd:useLimitation`
                - `useConstraints` ↔ `gmd:MD_LegalConstraints` mit `gmd:useConstraints` = `otherRestrictions`, je
                  Wert ein `gmd:otherConstraints`
                - `accessConstraints` ↔ `gmd:MD_LegalConstraints` mit `gmd:accessConstraints` = `otherRestrictions`,
                  je Wert ein `gmd:otherConstraints`; `key` ← ID des Eintrags der InGrid-Codeliste 6010 zum Wert
                - `source` ↔ Zeile `Quellenvermerk: <source>` bei `useConstraints`

                > Lesen: höchstens ein Eintrag je `type`; `source` auch aus dem Feld `quelle` eines JSON-Texts
                > (GDI-DE-Konvention), der selbst kein `item` wird; Codes außer `otherRestrictions` werden als
                > `item` übernommen.
              dcat-ap: |
                # Lesen & schreiben

                `dct:license | dct:accessRights | dcat:distribution/dct:rights`

                ## Mapping (logic)

                - `useConstraints` ↔ `dct:license` (`key` = IRI, `value` = Titel der Lizenz); `source` ↔
                  `dcat:distribution/dcatde:licenseAttributionByText`
                - `accessConstraints` ↔ `dct:accessRights` (`key` = IRI, `value` = Label)
                - `useLimitations` ↔ `dcat:distribution/dct:rights` (`dct:RightsStatement`, `value` = `rdfs:label`)

                > Lesen: höchstens ein Eintrag je `type`; Lizenzen der Ressource und aller Distributionen ohne
                > Duplikate. Schreiben: Lizenzen und `dct:rights` an jeder Distribution. UNKLAR: Werte ohne IRI
                > (`key`) bei `useConstraints` und `accessConstraints`.
            items:
              type: object
              title: item
              properties:
                type:
                  type: string
                  description: "Typ der Nutzungsbedingung oder Einschränkung. Kann 'accessConstraints', 'useConstraints' oder 'useLimitations' sein."
                  enum:
                    - accessConstraints
                    - useConstraints
                    - useLimitations
                items:
                  type: array
                  description: "Liste von Einschränkungen oder Nutzungsbedingungen abhängig vom Typ. Es wird die Codeliste 6500 für useConstraints, 6010 für accessConstraints und freie Werte für useLimitations verwendet."
                  items:
                    title: item
                    properties:
                      key:
                        type: [ "string", "null" ]
                      value:
                        type: [ "string", "null" ]
                      source:
                        type: string
                        description: "Quelle der Einschränkung"


          # - Identifikator des übergeordneten Datensatzes (parentIdentifier)
          parent_identifier:
            type: string
            description: "UUID des übergeordneten Datensatzes. Kann für die Strukturierung von Datensätzen verwendet werden."
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:parentIdentifier/gco:CharacterString`
              dcat-ap: |
                # Lesen & schreiben

                `dcat:inSeries`

                > Lesen: auch `dct:isPartOf`; `dct:identifier` der übergeordneten Ressource, sonst ihre IRI. UNKLAR:
                > Schreiben braucht die IRI der Serie, das Indexformat enthält nur die UUID.
          # - Fachinformationen
          #   - Identifikator der Datenquelle (datasourceIdentifier)
          datasource_identifier:
            type: string
            description: "Enthält den Identifikator der Datenquelle. Dieser muss eine auflösbare URL sein, die den Direktzugriff auf das XML des Daten-Metadatensatzes ermöglicht."
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:citation/gmd:CI_Citation/gmd:identifier/gmd:MD_Identifier/gmd:code/gco:CharacterString`

                > Lesen: auch `gmd:RS_Identifier`.
              dcat-ap: |
                # Lesen & schreiben

                `adms:identifier/skos:notation`
            examples:
              - https://registry.gdi-de.org/id/ingrid_cat/d848fd14-7a22-40ba-980a-3ea7e3fcbcae
          #   - Digitale Repräsentation
          spatial_representation:
            type: object
            title: "Digitale Repräsentation"
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:spatialRepresentationInfo`

                > Ein `gmd:spatialRepresentationInfo` je Eintrag; das Element darunter bestimmt `type` (siehe dort).
              dcat-ap: |
                # Lesen & schreiben

                `dcat:distribution/adms:representationTechnique`

                > Lesen: ein Eintrag je unterschiedlicher Darstellungsart aller Distributionen. Schreiben: alle
                > Typen an jeder Distribution.
            properties:
              type:
                type: string
                title: "Typ"
                description: "Beschreibt den Typ der Repräsentation"
                x-transform:
                  iso19139-2007: |
                    # Lesen & schreiben

                    `gmd:spatialRepresentationInfo/*`

                    ## Mapping (lookup)

                    - `vector` ↔ `gmd:MD_VectorSpatialRepresentation`
                    - `grid` ↔ `gmd:MD_Georectified` (wenn `grid.rectified` gesetzt ist), `gmd:MD_Georeferenceable`
                      (wenn `grid.referenced` gesetzt ist), sonst `gmd:MD_GridSpatialRepresentation`

                    > `text`, `tin`, `video` und `stereomodel` haben kein Gegenstück.
                  dcat-ap: |
                    # Lesen & schreiben

                    `dcat:distribution/adms:representationTechnique`

                    ## Mapping (lookup)

                    Letzter Pfadabschnitt der IRI aus
                    `http://inspire.ec.europa.eu/metadata-codelist/SpatialRepresentationType/`:

                    - `vector` ↔ `vector`
                    - `grid` ↔ `grid`
                    - `text` ↔ `textTable`
                    - `tin` ↔ `tin`
                    - `stereomodel` ↔ `stereoModel`
                    - `video` ↔ `video`
                enum:
                  - text
                  - vector
                  - tin
                  - video
                  - stereomodel
                  - grid
              vector:
                type: array
                title: "Vector"
                description: "Beschreibt die digitale Repräsentation als eine Liste von Vektor-Daten."
                x-transform:
                  iso19139-2007: |
                    # Lesen & schreiben

                    `gmd:spatialRepresentationInfo/*/gmd:geometricObjects/gmd:MD_GeometricObjects`

                    > Nur bei `gmd:MD_VectorSpatialRepresentation`; ein `gmd:MD_GeometricObjects` je Eintrag.
                  dcat-ap: |
                    Kein Gegenstück in DCAT-AP.
                items:
                  properties:
                    topology:
                      type: string
                      description: "Beschreibt die Topologie des Vektor-Datensatzes"
                      x-transform:
                        iso19139-2007: |
                          # Lesen & schreiben

                          `gmd:spatialRepresentationInfo/*/gmd:topologyLevel/gmd:MD_TopologyLevelCode/@codeListValue`

                          > Gilt für die ganze Repräsentation. Schreiben: aus dem ersten Eintrag.
                    geometry_type:
                      type: string
                      description: "Beschreibt den Typ der Geometrie"
                      x-transform:
                        iso19139-2007: |
                          # Lesen & schreiben

                          `gmd:spatialRepresentationInfo/*/gmd:geometricObjects/gmd:MD_GeometricObjects/gmd:geometricObjectType/gmd:MD_GeometricObjectTypeCode/@codeListValue`
                    number:
                      type: integer
                      description: "Beschreibt die Anzahl der Punkt- oder Vektortypelemente im Datensatz"
                      x-transform:
                        iso19139-2007: |
                          # Lesen & schreiben

                          `gmd:spatialRepresentationInfo/*/gmd:geometricObjects/gmd:MD_GeometricObjects/gmd:geometricObjectCount/gco:Integer`
              grid:
                title: "Raster/Gitter"
                description: "Enthält die Information über die Strukturelemente der Rasterdaten. Aktuell nicht im Portal angezeigt?"
                properties:
                  axes:
                    type: array
                    x-transform:
                      iso19139-2007: |
                        # Lesen & schreiben

                        `gmd:spatialRepresentationInfo/*/gmd:axisDimensionProperties/gmd:MD_Dimension`

                        > Bei allen Raster-Elementen.
                      dcat-ap: |
                        Kein Gegenstück in DCAT-AP.
                    items:
                      properties:
                        label:
                          type: string
                          description: "Beschreibt den Namen der Achse"
                          x-transform:
                            iso19139-2007: |
                              # Lesen & schreiben

                              `gmd:spatialRepresentationInfo/*/gmd:axisDimensionProperties/gmd:MD_Dimension/gmd:dimensionName/gmd:MD_DimensionNameTypeCode/@codeListValue`

                              > Wert unverändert (z. B. `row`, `column`, `vertical`).
                        number:
                          type: integer
                          description: "Beschreibt die Anzahl der Achsen im Raster"
                          x-transform:
                            iso19139-2007: |
                              # Lesen & schreiben

                              `gmd:spatialRepresentationInfo/*/gmd:axisDimensionProperties/gmd:MD_Dimension/gmd:dimensionSize/gco:Integer`

                              > Anzahl der Elemente entlang dieser Achse.
                        resolution:
                          type: integer
                          description: "Beschreibt die Auflösung der Achsen im Raster in Metern"
                          x-transform:
                            iso19139-2007: |
                              # Lesen & schreiben

                              `gmd:spatialRepresentationInfo/*/gmd:axisDimensionProperties/gmd:MD_Dimension/gmd:resolution/gco:Length`

                              > In Meter, geschrieben mit `@uom="m"`. Lesen: jede Maßangabe (`gmd:resolution/*`), umgerechnet nach
                              > `@uom`.
                  available_parameters:
                    type: boolean
                    description: "Beschreibt, ob Parameter für das Raster verfügbar sind"
                    x-transform:
                      iso19139-2007: |
                        # Lesen & schreiben

                        `gmd:spatialRepresentationInfo/*/gmd:transformationParameterAvailability/gco:Boolean`
                      dcat-ap: |
                        Kein Gegenstück in DCAT-AP.
                  number_dimensions:
                    type: integer
                    description: "Beschreibt die Anzahl der unabhängigen räumlich-zeitlichen Achsen"
                    x-transform:
                      iso19139-2007: |
                        # Lesen & schreiben

                        `gmd:spatialRepresentationInfo/*/gmd:numberOfDimensions/gco:Integer`
                      dcat-ap: |
                        Kein Gegenstück in DCAT-AP.
                  cell_geometry:
                    $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                    description: "Angabe, ob die Rasterdatenzelle einen Punkt oder eine Fläche beschreibt. Hier wird die Codeliste 509 verwendet."
                    x-transform:
                      iso19139-2007: |
                        # Lesen & schreiben

                        `gmd:spatialRepresentationInfo/*/gmd:cellGeometry/gmd:MD_CellGeometryCode/@codeListValue`

                        ## Mapping (logic)

                        - `value` ↔ Code
                        - `key` ← ID des Eintrags der InGrid-Codeliste 509 zum Code
                      dcat-ap: |
                        Kein Gegenstück in DCAT-AP.
                  rectified:
                    title: "Georektifiziertes Raster"
                    properties:
                      checkpoint_availability:
                        type: boolean
                        description: "Beschreibt, ob die Punkte für die Rasterdatenzelle geprüft werden."
                        x-transform:
                          iso19139-2007: |
                            # Lesen & schreiben

                            `gmd:spatialRepresentationInfo/*/gmd:checkPointAvailability/gco:Boolean`

                            > Nur bei `gmd:MD_Georectified`.
                          dcat-ap: |
                            Kein Gegenstück in DCAT-AP.
                      checkpoint_description:
                        type: string
                        description: "Beschreibt die Beschreibung der Punkte, die für die Rasterdatenzelle verwendet werden. Hier wird die Codeliste 510 verwendet."
                        x-transform:
                          iso19139-2007: |
                            # Lesen & schreiben

                            `gmd:spatialRepresentationInfo/*/gmd:checkPointDescription/gco:CharacterString`

                            > Nur bei `gmd:MD_Georectified`. Freitext.
                          dcat-ap: |
                            Kein Gegenstück in DCAT-AP.
                      corner_points:
                        type: string
                        x-transform:
                          iso19139-2007: |
                            # Lesen & schreiben

                            `gmd:spatialRepresentationInfo/*/gmd:cornerPoints`

                            ## Mapping (logic)

                            - je Eckpunkt (durch Komma getrennt) ↔ `gml:Point/gml:pos` (mit `gml:id`)

                            > Nur bei `gmd:MD_Georectified`. Lesen: auch GML 3.2 (`gml32:`).
                          dcat-ap: |
                            Kein Gegenstück in DCAT-AP.
                      point_in_pixel:
                        $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                        description: "Enthält den Punkt im Pixel, an welchem der Bezug zur Erde besteht. Hier wird die Codeliste 2100 verwendet."
                        x-transform:
                          iso19139-2007: |
                            # Lesen & schreiben

                            `gmd:spatialRepresentationInfo/*/gmd:pointInPixel/gmd:MD_PixelOrientationCode`

                            ## Mapping (logic)

                            - `value` ↔ Wert (z. B. `center`)
                            - `key` ← ID des Eintrags der InGrid-Codeliste 2100 zum Wert

                            > Nur bei `gmd:MD_Georectified`.
                          dcat-ap: |
                            Kein Gegenstück in DCAT-AP.
                  referenced:
                    title: "Georeferenzierbares Raster"
                    properties:
                      orientation_parameter_availability:
                        type: boolean
                        description: "Angabe, ob Orientierungsparameter verfügbar sind."
                        x-transform:
                          iso19139-2007: |
                            # Lesen & schreiben

                            `gmd:spatialRepresentationInfo/*/gmd:orientationParameterAvailability/gco:Boolean`

                            > Nur bei `gmd:MD_Georeferenceable`.
                          dcat-ap: |
                            Kein Gegenstück in DCAT-AP.
                      control_point_availability:
                        type: boolean
                        description: "Angabe, ob Passpunkte existieren."
                        x-transform:
                          iso19139-2007: |
                            # Lesen & schreiben

                            `gmd:spatialRepresentationInfo/*/gmd:controlPointAvailability/gco:Boolean`

                            > Nur bei `gmd:MD_Georeferenceable`. Der Feldname im Indexformat weicht in der Schreibweise vom
                            > ISO-Element ab.
                          dcat-ap: |
                            Kein Gegenstück in DCAT-AP.
                      parameters:
                        type: string
                        description: "Parameter, die die Georeferenzierung der Rasterdaten ermöglichen"
                        x-transform:
                          iso19139-2007: |
                            # Lesen & schreiben

                            `gmd:spatialRepresentationInfo/*/gmd:georeferencedParameters/gco:Record`

                            > Nur bei `gmd:MD_Georeferenceable`. Lesen: ohne `gmd:georeferencedParameters` der Titel der ersten
                            > `gmd:parameterCitation`.
                          dcat-ap: |
                            Kein Gegenstück in DCAT-AP.

          #   - Erstellungsmaßstab
          spatial_resolution_scale:
            type: object
            x-transform:
              iso19139-2007: |
                # Lesen & schreiben

                `gmd:identificationInfo/*/gmd:spatialResolution/gmd:MD_Resolution`

                > Nur Datensätze. Ein `gmd:MD_Resolution` enthält entweder `gmd:equivalentScale` oder
                > `gmd:distance`. Schreiben: ein `gmd:MD_Resolution` je gesetztem Unterfeld.
              dcat-ap: |
                # Lesen & schreiben

                `dcat:spatialResolutionInMeters`

                > Nur `resolution_ground`.
            properties:
              scale:
                type: integer
                description: "Angabe des Erstellungsmaßstabs"
                x-transform:
                  iso19139-2007: |
                    # Lesen & schreiben

                    `gmd:identificationInfo/*/gmd:spatialResolution/gmd:MD_Resolution/gmd:equivalentScale/gmd:MD_RepresentativeFraction/gmd:denominator/gco:Integer`
                  dcat-ap: |
                    Kein Gegenstück in DCAT-AP.
                examples:
                  - 25000 für 1:25.000
              resolution_ground:
                type: number
                description: "Bodenauflösung in Metern"
                x-transform:
                  iso19139-2007: |
                    # Lesen & schreiben

                    `gmd:identificationInfo/*/gmd:spatialResolution/gmd:MD_Resolution/gmd:distance/gco:Distance`

                    > In Meter, geschrieben mit `@uom="m"`. Lesen: `gco:Distance` mit anderer Einheit als `dpi`,
                    > umgerechnet nach `@uom`.
                  dcat-ap: |
                    # Lesen & schreiben

                    `dcat:spatialResolutionInMeters`
              resolution_scan:
                type: number
