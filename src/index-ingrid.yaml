$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.com/schemas/1.0.0/dcat.yaml
title: InGrid Index - InGrid
description: |
  Dies ist das JSON-Schema für den InGrid-Index.
  Folgende Anmerkungen zu den "Root fields":
  
  * references[].type kann die folgenden Werte enthalten
    * Codeliste 2000
    * previewGraphic

type: object
unevaluatedProperties: false
allOf:
  - $ref: ./parts/core.yaml
  - $ref: "#/$defs/InGrid"
$defs:
  InGrid:
    type: object
    title: InGrid
    properties:
      metadata:
        type: object
        description: "Enthält zusätzliche Metadaten zum Datensatz."
        unevaluatedProperties: false
        allOf:
          - $ref: ./parts/core.yaml#/$defs/Metadata
          - type: object
            title: InGrid Metadata
            properties:
              data_type:
                type: string
                enum:
                  - INGRID
                  - UMWELTNAVI
              document_type:
                type: string
                description: "Beschreibt den Typ des Metadatensatzes."
              language:
                type: string
                description: Enthält die Sprache des Metadatensatzes. Hier wird die Codeliste 99999999 verwendet.
              partner:
                type: string
                description: Der Partner der Datenquelle als Kürzel. Siehe auch Codeliste 110.
              provider:
                type: string
                description: Der Anbieter der Datenquelle als Kürzel. Dieser wird aus der Codeliste 111 genommen.
                examples:
                  - ni_gll
            if:
              properties:
                data_type:
                  const: "INGRID"
              required: [ data_type ]
            then:
              properties:
                document_type:
                  enum:
                    - InGridGeoDataset
                    - InGridDataCollection
                    - InGridGeoService
                    - InGridInformationSystem
                    - InGridPublication
                    - InGridProject
                    - InGridSpecialisedTask
            required:
              - data_type

      # - Aktualität des Datensatzes
      #   - Status (temporal.status)
      #   - Pflegeintervall (temporal.maintenanceFrequency)
      #   - Benutzerdefiniertes Pflegeintervall (temporal.userDefinedMaintenanceFrequency)
      temporal:
        type: object
        description: "Enthält zusätzliche Informationen zur Aktualität des Datensatzes, einschließlich Status, Pflegeintervall und benutzerdefinierten Pflegeintervall."
        unevaluatedProperties: false
        allOf:
          - $ref: ./parts/shared-types.yaml#/$defs/Temporal
          - type: object
            title: InGrid Temporal
            properties:
              status:
                $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                description: "In welchem Zustand ist der Datensatz? Hier wird die Codeliste 523 verwendet."
                examples:
                  - 1 - abgeschlossen
                  - 2 - historisches Archiv
              maintenance_frequency:
                $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                description: "Enthält das Pflegeintervall des Datensatzes. Es wird die Codeliste 518 verwendet."
                examples:
                  - 2 - täglich
                  - 3 - wöchentlich
                  - 5 - monatlich
              user_defined_maintenance_frequency_in_sec:
                type: string
                description: "Enthält das benutzerdefinierte Pflegeintervall des Datensatzes in Sekunden."
                examples:
                  - 60
      exports:
        unevaluatedProperties: true
        properties:
          iso:
            type: string
            description: "Enthält das vollständige ISO-19139-Dokument im XML-Format."

      ingrid:
        properties:

          # portal specific

          # CORE

          # - Titel (c)
          # - Tags, wie OpenData (c)
          # - ansprechpartner (c)
          #   - Erstellung (c)
          #   - Publikation (c)
          #   - Letzte Änderung (c)
          # - Raumbezug (c)
          # - Koordinatensystem (c)
          # - Kontakte (c)
          # - Schlagworte (c)
          #   - UUID (c)
          #   - Aktualität (c?)

          # PROFILE

          # Kurzbezeichnung
          alternate_title:
            type: string
            description: "Ermöglicht das Setzen eines alternativen Titels oder eine Kurzbeschreibung des Datensatzes."

          # - Typ (metadata.type)
          # - Informationen zum Metadatensatz
          #   - Sprache
          #   - Datensatz/serie
          #   - ISO-XML - Link (im Portal generiert - CSW-Schnittstelle)
          #   - Ansprechpartner (Metadatum)
          #   - Quelle


          # - downloads (references)
          # - vorschaubilder (references)
          # - Verweise und Downloads (references)

          # - nutzungsbedingungen (licenses)
          # - Nutzungsbedingungen (licenses)
          # - Anwendungseinschränkungen (licenses)
          # access- and use-constraints and use limitations
          licenses:
            type: array
            description: "Liste der Nutzungsbedingungen oder Einschränkungen für die Verwendung der externen Ressource oder Download."
            items:
              type: object
              title: item
              properties:
                type:
                  type: string
                  description: "Typ der Nutzungsbedingung oder Einschränkung. Kann 'accessConstraints', 'useConstraints' oder 'useLimitations' sein."
                  enum:
                    - accessConstraints
                    - useConstraints
                    - useLimitations
                items:
                  type: array
                  description: "Liste von Einschränkungen oder Nutzungsbedingungen abhängig vom Typ. Es wird die Codeliste 6500 für useConstraints, 6010 für accessConstraints und freie Werte für useLimitations verwendet."
                  items:
                    title: item
                    $ref: ./parts/shared-types.yaml#/$defs/KeyValue
          # - Identifikator des übergeordneten Datensatzes (parentIdentifier)
          parent_identifier:
            type: string
            description: "UUID des übergeordneten Datensatzes. Kann für die Strukturierung von Datensätzen verwendet werden."
          # - Fachinformationen
          #   - Identifikator der Datenquelle (datasourceIdentifier)
          datasource_identifier:
            type: string
            description: "Enthält den Identifikator der Datenquelle. Dieser muss eine auflösbare URL sein, die den Direktzugriff auf das XML des Daten-Metadatensatzes ermöglicht."
            examples:
              - https://registry.gdi-de.org/id/ingrid_cat/d848fd14-7a22-40ba-980a-3ea7e3fcbcae
          #   - Digitale Repräsentation
          spatial_representation:
            type: array
            title: "Digitale Repräsentation"
            items:
              properties:
                type:
                  type: string
                  title: "Typ"
                  description: "Beschreibt den Typ der Repräsentation"
                  enum:
                    - text
                    - vector
                    - tin
                    - video
                    - stereomodel
                    - grid
                vector:
                  type: array
                  title: "Vector"
                  description: "Beschreibt die digitale Repräsentation als eine Liste von Vektor-Daten."
                  items:
                    properties:
                      topology:
                        type: string
                        description: "Beschreibt die Topologie des Vektor-Datensatzes"
                      geometry_type:
                        type: string
                        description: "Beschreibt den Typ der Geometrie"
                      number:
                        type: integer
                        description: "Beschreibt die Anzahl der Punkt- oder Vektortypelemente im Datensatz"
                grid:
                  title: "Raster/Gitter"
                  description: "Enthält die Information über die Strukturelemente der Rasterdaten. Aktuell nicht im Portal angezeigt?"
                  properties:
                    axes:
                      type: array
                      items:
                        properties:
                          label:
                            type: string
                            description: "Beschreibt den Namen der Achse"
                          number:
                            type: integer
                            description: "Beschreibt die Anzahl der Achsen im Raster"
                          resolution:
                            type: integer
                            description: "Beschreibt die Auflösung der Achsen im Raster in Metern"
                    available_parameters:
                      type: boolean
                      description: "Beschreibt, ob Parameter für das Raster verfügbar sind"
                    number_dimensions:
                      type: integer
                      description: "Beschreibt die Anzahl der unabhängigen räumlich-zeitlichen Achsen"
                    cell_geometry:
                      $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                      description: "Angabe, ob die Rasterdatenzelle einen Punkt oder eine Fläche beschreibt. Hier wird die Codeliste 509 verwendet."
                    rectified:
                      title: "Georektifiziertes Raster"
                      properties:
                        checkPointAvailability:
                          type: boolean
                          description: "Beschreibt, ob die Punkte für die Rasterdatenzelle geprüft werden."
                        checkPointDescription:
                          type: string
                          description: "Beschreibt die Beschreibung der Punkte, die für die Rasterdatenzelle verwendet werden. Hier wird die Codeliste 510 verwendet."
                        cornerPoints:
                          type: string
                        pointInPixel:
                          $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                          description: "Enthält den Punkt im Pixel, an welchem der Bezug zur Erde besteht. Hier wird die Codeliste 2100 verwendet."
                    referenced:
                      title: "Georeferenzierbares Raster"
                      properties:
                        orientationParameterAvailability:
                          type: boolean
                          description: "Angabe, ob Orientierungsparameter verfügbar sind."
                        controlPointAvaliability:
                          type: boolean
                          description: "Angabe, ob Passpunkte existieren."
                        parameters:
                          type: string
                          description: "Parameter, die die Georeferenzierung der Rasterdaten ermöglichen"

          #   - Erstellungsmaßstab
          spatialResolutionScale:
            type: object
            properties:
              scale:
                type: integer
                description: "Angabe des Erstellungsmaßstabs"
                examples:
                  - 25000 für 1:25.000
              resolution_ground:
                type: number
                description: "Bodenauflösung in Metern"
              resolution_scan:
                type: number
                description: "Scan-Auflösung in DPI"

          #   - Darstellender Dienst (als Referenz!)
          cross_references:
            type: array
            items:
              type: object
              properties:
                uuid:
                  type: string
                name:
                  type: string
                document_type:
                  type: string
                description:
                  type: string
                reference_type:
                  type: string
                direction:
                  type: string
                  enum:
                    - IN
                    - OUT

          #   - Datengrundlage/Herkunft
          lineage:
            type: object
            title: "Datenherkunft"
            description: "Angaben zur Herkunft und Entstehung der Daten (Lineage)"
            properties:
              statement:
                type: string
                description: "Allgemeine Beschreibung der Datenherkunft/Prozesskette"
              source:
                type: string
                description: "Beschreibung der Ausgangsdaten"
              process_step:
                type: string
                description: "Beschreibung der Bearbeitungsschritte"

          #   - Herstellungsprozess
          processStepDescription:
            type: array
            description: "Angabe der Methode, die zur Erstellung des Datenobjektes geführt hat."
            items:
              type: string
          #   - Symbolkatalog
          symbolCatalogue:
            type: array
            description: "Für die Präsentation genormter Objekte und Sachverhalte können für die Nutzer der Daten zur Herstellung von Karten abgestimmte Symbole vorgegeben werden"
            items:
              type: object
              properties:
                title:
                  type: string
                  description: "Titel des Symbolkataloges"
                date:
                  type: string
                  description: "Datum des Symbolkataloges"
                version:
                  type: string
                  description: "Version des Symbolkataloges"
          #   - Schlüsselkatalog
          codeListReference:
            type: array
            description: "An dieser Stelle besteht die Möglichkeit, den Daten zugrunde liegende Klassifizierungsschlüssel zu benennen."
            items:
              type: object
              properties:
                title:
                  type: string
                  description: "Titel des Schlüsselkataloges"
                date:
                  type: string
                  description: "Datum des Schlüsselkataloges"
                version:
                  type: string
                  description: "Version des Schlüsselkataloges"
          #   - Sachdaten/Attributinformation
          attributeDescription:
            type: array
            description: "Angabe der mit der Geo-Information/Karte verbundenen Sachdaten."
            items:
              type: string

          spatial:
            type: object
            properties:
              description:
                type: string
                description: "Erläuterung zu den Raumbezügen"
              vertical_extent:
                type: object
                title: Vertikale Ausdehnung
                description: Höhenbereich der beschriebenen Daten, z. B. für Höhenmodelle.
                properties:
                  minimum:
                    type: number
                    description: Minimaler Wert der vertikalen Ausdehnung
                  maximum:
                    type: number
                    description: Maximaler Wert der vertikalen Ausdehnung
                  unit:
                    type: object
                    description: Maßeinheit der vertikalen Ausdehnung. Hier wird die Codeliste 102 verwendet.
                    $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                  vdatum:
                    type: object
                    description: Bezugssystem (vertikales Datum) der Höhenangabe. Hier wird die Codeliste 101 verwendet.
                    $ref: ./parts/shared-types.yaml#/$defs/KeyValue
          # - Zusatzinformationen
          #   - Eignung
          specific_usage:
            type: string
          #   - Herstellungszweck
          purpose:
            type: string
          #   - Sprache (c)
          #language:
          #  type: string
          #   - Konformität
          conformance_result:
            type: array
            items:
              title: item
              properties:
                pass:
                  type: string
                  enum:
                    - conformant
                    - not-conformant
                    - not-evaluated
                specification:
                  type: object
                  $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                publicationDate:
                  type: string
                explanation:
                  type: string

          #   - Bestellinformationen
          order_info:
            type: string

          # Datenqualität
          data_quality:
            properties:
              completenessOmission:
                type: number
              positionalAccuracy:
                properties:
                  horizontal:
                    type: number
                  vertical:
                    type: number
              qualities:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - completenessComission
                      - conceptualConsistency
                      - domainConsistency
                      - formatConsistency
                      - topologicalConsistency
                      - temporalConsistency
                      - thematicClassificationCorrectness
                      - nonQuantitativeAttributeAccuracy
                      - quantitativeAttributeAccuracy
                      - relativeInternalPositionalAccuracy
                    measure_type:
                      type: object
                      $ref: ./parts/shared-types.yaml#/$defs/KeyValue
                    value:
                      type: number
                    parameter:
                      type: string

          character_set:
            type: object
            description: "Angaben zu dem im beschriebenen Datensatz benutzten Zeichensatz."
            $ref: ./parts/shared-types.yaml#/$defs/KeyValue

          service:
            type: object
            description: "Angaben zu einem Geodaten-Dienst"
            properties:
              type:
                type: string
                description: Art des Dienstes
              classifications:
                type: array
                items:
                  type: string
                  examples:
                    - Dienst für die Konversion von Koordinaten
              versions:
                type: array
                items:
                  type: string
                  examples:
                    - OGC:WMS 1.3.0
              operations:
                type: array
                items:
                  properties:
                    name:
                      type: string
                      description: Name der Operation
                    description:
                      type: string
                      description: Beschreibung der Operation
                    access_url:
                      type: string
                      description: URL zur Operation
              # Dargestellte Daten, siehe cross_references bzw. references

              # Erstellungsmaßstab, siehe: spatialResolutionScale

              environmentDescription:
                type: string
                description: Angaben zum Betriebssystem und der Software, ggf. auch Hardware, die zur Implementierung des Dienstes eingesetzt wird.
              serviceHistory:
                type: string
                description: Angaben zur Implementierungsgeschichte des Dienstes.
              additionalInformation:
                type: string
                description: Zusätzliche Informationen zum Dienst
              hasAccessConstraints:
                type: boolean
                description: Ist der Zugriff auf den Dienst eingeschränkt?
              doi:
                type: object
                properties:
                  identifier:
                    type: string
                    description: Angabe des DOI (Digital Object Identifier) des Dokumentes
                  generalResourceType:
                    type: string
                    description: Angabe der übergeordneten Art des Dokumentes
                  resourceType:
                    type: string
                    description: Angabe der Art des Dokumentes

          # TODO: merge references and fileReferences
          # TODO: properties to tags (core?)
          # TODO: parentIdentifier (core?)
