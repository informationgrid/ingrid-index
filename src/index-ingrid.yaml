$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.com/schemas/1.0.0/dcat.yaml
title: Schema for InGrid Index 'InGrid'
type: object
allOf:
  - $ref: ./parts/core.yaml
  - type: object
    title: InGrid
    properties:

      iso:
        type: string
        description: "Enthält das vollständige ISO-19139-Dokument im XML-Format."

      # moved to core elements
      # - title
      # - description
      # - pointOfContact
      # - keywords & themes
      # - spatial

      # access- and use-constraints and use limitations
      licenses:
        type: array
        items:
          type: object
          title: item
          properties:
            key:
              type: string
            value:
              type: string

      # TODO: merge references and fileReferences
      # TODO: properties to tags (core?)
      # TODO: parentIdentifier (core?)

# FROM EDITOR

      properties:
        type: object
        title: properties
        properties:
          subType:
            type: object
            title: subType
            properties:
              key:
                type: string
          isInspireIdentified:
            type: string
          isOpenData:
            type: boolean
          isAdVCompatible:
            type: boolean
      parentIdentifier:
        type: string
      alternateTitle:
        type: string
      graphicOverviews:
        type: array
        items:
          type: object
          title: item
          properties:
            fileName:
              type: object
              title: fileName
              properties:
                uri:
                  type: string
                value:
                  type: string
                asLink:
                  type: boolean
            fileDescription:
              type: string
      advProductGroups:
        type: array
        items:
          type: object
          title: item
          properties:
            key:
              type: string
            value:
              type: string
            _codelistId:
              type: string
      topicCategories:
        type: array
        items:
          type: object
          title: item
          properties:
            key:
              type: string
            value:
              type: string
            _codelistId:
              type: string
      lineage:
        type: object
        title: lineage
        properties:
          statement:
            type: string
      identifier:
        type: string
      spatialRepresentationType:
        type: array
        items:
          type: object
          title: item
          properties:
            key:
              type: string
            value:
              type: string
            _codelistId:
              type: string
      resolution:
        type: array
        items:
          type: object
          title: item
          properties:
            denominator:
              type: integer
            distanceMeter:
              type: integer
            distanceDPI:
              type: integer
      dataQualityInfo:
        type: object
        title: dataQualityInfo
        properties:
          lineage:
            type: object
            title: lineage
            properties:
              source:
                type: object
                title: source
                properties:
                  descriptions:
                    type: array
                    items:
                      type: object
                      title: item
                      properties:
                        _type:
                          type: string
                        value:
                          type: string
                  processStep:
                    type: object
                    title: processStep
                    properties:
                      description:
                        type: array
                        items:
                          type: object
                          title: item
                          properties:
                            key:
                              type: 'null'
                            value:
                              type: string
      portrayalCatalogueInfo:
        type: object
        title: portrayalCatalogueInfo
        properties:
          citation:
            type: array
            items:
              type: object
              title: item
              properties:
                title:
                  type: object
                  title: title
                  properties:
                    key:
                      type: string
                date:
                  type: string
                edition:
                  type: string
      featureCatalogueDescription:
        type: object
        title: featureCatalogueDescription
        properties:
          citation:
            type: array
            items:
              type: object
              title: item
              properties:
                title:
                  type: object
                  title: title
                  properties:
                    key:
                      type: string
                date:
                  type: string
                edition:
                  type: string
          featureTypes:
            type: array
            items:
              type: object
              title: item
              properties:
                key:
                  type: 'null'
                value:
                  type: string
      dataQuality:
        type: object
        title: dataQuality
        properties:
          completenessOmission:
            type: object
            title: completenessOmission
            properties:
              measResult:
                type: integer
      absoluteExternalPositionalAccuracy:
        type: object
        title: absoluteExternalPositionalAccuracy
        properties:
          vertical:
            type: integer
          horizontal:
            type: integer
      qualities:
        type: array
        items:
          type: object
          title: item
          properties:
            _type:
              type: string
            measureType:
              type: object
              title: measureType
              properties:
                key:
                  type: string
            value:
              type: integer
            parameter:
              type: string
      maintenanceInformation:
        type: object
        title: maintenanceInformation
        properties:
          maintenanceAndUpdateFrequency:
            type: object
            title: maintenanceAndUpdateFrequency
            properties:
              key:
                type: string
              value:
                type: string
              _codelistId:
                type: string
          userDefinedMaintenanceFrequency:
            type: object
            title: userDefinedMaintenanceFrequency
            properties:
              number:
                type: integer
              unit:
                type: object
                title: unit
                properties:
                  key:
                    type: string
                  value:
                    type: string
                  _codelistId:
                    type: string
          description:
            type: string
      metadata:
        type: object
        title: metadata
        properties:
          language:
            type: object
            title: language
            properties:
              key:
                type: string
              value:
                type: string
              _codelistId:
                type: string
          characterSet:
            type: object
            title: characterSet
            properties:
              key:
                type: string
              value:
                type: string
              _codelistId:
                type: string
      dataset:
        type: object
        title: dataset
        properties:
          languages:
            type: array
            items:
              type: string
      conformanceResult:
        type: array
        items:
          type: object
          title: item
          properties:
            pass:
              type: object
              title: pass
              properties:
                key:
                  type: string
                value:
                  type: string
                _codelistId:
                  type: string
            isInspire:
              type: boolean
            specification:
              type: object
              title: specification
              properties:
                key:
                  type: string
                value:
                  type: string
                _codelistId:
                  type: string
            publicationDate:
              type: string
      extraInfo:
        type: object
        title: extraInfo
        properties:
          legalBasicsDescriptions:
            type: array
            items:
              type: object
              title: item
              properties:
                key:
                  type: string
                value:
                  type: string
                _codelistId:
                  type: string
      resource:
        type: object
        title: resource
        properties:
          purpose:
            type: string
          specificUsage:
            type: string
          accessConstraints:
            type: array
            items:
              type: object
              title: item
              properties:
                key:
                  type: string
                value:
                  type: string
                _codelistId:
                  type: string
          useConstraints:
            type: array
            items:
              type: object
              title: item
              properties:
                title:
                  type: object
                  title: title
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    _codelistId:
                      type: string
                source:
                  type: string
          useLimitation:
            type: string
      distribution:
        type: object
        title: distribution
        properties:
          format:
            type: array
            items:
              type: object
              title: item
              properties:
                name:
                  type: object
                  title: name
                  properties:
                    key:
                      type: string
                version:
                  type: string
                compression:
                  type: string
                specification:
                  type: string
      digitalTransferOptions:
        type: array
        items:
          type: object
          title: item
          properties:
            name:
              type: object
              title: name
              properties:
                key:
                  type: string
                value:
                  type: string
                _codelistId:
                  type: string
            transferSize:
              type: object
              title: transferSize
              properties:
                value:
                  type: integer
                unit:
                  type: object
                  title: unit
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    _codelistId:
                      type: 'null'
            mediumNote:
              type: string
      orderInfo:
        type: string
      references:
        type: array
        items:
          type: object
          title: item
          properties:
            url:
              type: string
            type:
              type: object
              title: type
              properties:
                key:
                  type: string
                value:
                  type: string
                _codelistId:
                  type: string
            title:
              type: string
            explanation:
              type: string
            referenceType:
              type: string
      fileReferences:
        type: array
        items:
          type: object
          title: item
          properties:
            link:
              type: object
              title: link
              properties:
                uri:
                  type: string
                value:
                  type: string
                asLink:
                  type: boolean
                sizeInBytes:
                  type: integer
            title:
              type: string
            format:
              type: object
              title: format
              properties:
                key:
                  type: string
            description:
              type: string
      spatialScope:
        type: object
        title: spatialScope
        properties:
          key:
            type: string
          value:
            type: string
          _codelistId:
            type: string
      invekosKeywords:
        type: array
        items:
          type: object
      priorityDatasets:
        type: array
        items:
          type: object
      vectorSpatialRepresentation:
        type: array
        items:
          type: object
          title: item
          properties:
            topologyLevel:
              type: object
              title: topologyLevel
              properties:
                key:
                  type: string
                value:
                  type: string
                _codelistId:
                  type: string
            geometricObjectType:
              type: object
              title: geometricObjectType
              properties:
                key:
                  type: string
                value:
                  type: string
                _codelistId:
                  type: string
            geometricObjectCount:
              type: integer
      gridSpatialRepresentation:
        type: object
        title: gridSpatialRepresentation
        properties:
          type:
            type: 'null'

