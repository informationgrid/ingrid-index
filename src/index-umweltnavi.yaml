$schema: https://json-schema.org/draft/2020-12/schema
title: InGrid Index - Umweltnavi
type: object
allOf:
  - $ref: ./parts/core.yaml
  - $ref: ./index-ingrid.yaml#/$defs/InGrid
    title: InGrid
  - type: object
    title: UmweltNavi
    properties:
      metadata:
        properties:
          data_type:
            type: string
            const: 'UMWELTNAVI'
          document_type:
            description: Definiert den Statuslayer des Dokuments
            type: string
            enum:
              - object
              - map
              - statistic
          datasource:
            $ref: "./parts/core.yaml#/$defs/Metadata/properties/datasource"
            description: Beschreibt Datenkatalog (Herkunft)
            examples:
              - NLWKN_DSK
        required:
          - data_type
          - document_type
          - datasource
          - provider
      spatials:
        type: array
        items:
          type: object
          allOf:
            - $ref: "./parts/core.yaml#/$defs/SpatialItem"
            - type: object
              title: UmweltNavi Spatial
              properties:
                centroid:
                  type: string
                  description: Schwerpunkt der Geometrie
                inside_point:
                  type: string
                  description: Punkt innerhalb der Geometrie, der dem Schwerpunkt am nächsten
                    liegt.
                geometry_points:
                  type: string
                  description: Geometrie als Punkte, wird für Distanz Berechnung verwendet (geo_distance
                    Sortierung funktioniert nicht mit geo_shape)
                  $comment: 'Ehemaliges Indexfeld: location_points'
                outline:
                  type: array
                  items:
                    type: string
                    description: Outline für die Darstellung, ggf. reduzierte Geometrie
                  minItems: 0
      umweltnavi:
        type: object
        description: All field for umweltnavi
        properties:
          oid:
            type: string
            description: 'Objekt ID (eindeutig über alle Datenkataloge). Setzt sich aus 
              "source" und "source_id" (bzw. "source" und "origin" und
              "classification") zusammen und wird für Eigenschaft "id" verwendet.'
            examples:
            - nlwkn-dsk-4922-21000
          part:
            type: number
            description: | 
              Wegen zu großer Geometrien, können für Objekte verschiedene Sub Geometrien existieren. 
              BIPU Index Modell
              In UMWELTNAVI immer 0; in UMWELTNAVI_SUB_GEOMETRY immer > 0
              Wenn > 0 dann wird nur das Feld "geometrie" verwendet.
            minimum: 0
            $comment: 'Ehemaliges Indexfeld: doc_index'
          provider:
            type: object
            description: Enthält Informationen über den Anbieter für die Facetten-Auswahl
            properties:
              id:
                type: string
                description: Der Slug für die Filterung nach dem Anbieter
                examples:
                - bundesanstalt-fuer-gewaesserkunde-bfg
              name:
                type: string
                description: Name des Anbieters
                examples:
                - Bundesanstalt für Gewässerkunde (BfG)
            required:
              - id
          category:
            type: object
            properties:
              name:
                type: string
                examples:
                - Lärmindex Nacht
              slug:
                type: string
                examples:
                - laermindex-nacht
            required:
            - name
            - slug
            description: Kategorie im BIPU Datenmodell
          lod_weight:
            type: number
            description: Level of Detail für das Einblenden von Objekten, wenn weiter raus
            $comment: 'Ehemaliges Indexfeld: lod_sort_weight'
          source_id:
            type: string
            description: 'ID des Objektes innerhalb des Datenkataloges, Teil der OID, Nicht für "Status-Layer"'
            $comment: 'Ehemaliges Indexfeld: code'
          origin:
            type: string
            description: 'Nur für "Status-Layer", zusammen mit Kategorie "Lärmindex Nacht" ergibt sich folgende Id: laermindex-nacht-strasse-city-50'
            examples:
              - Straße (City)
          classification:
            type: string
            description: 'Nur für "Status-Layer", zusammen mit Kategorie "Lärmindex Nacht" ergibt sich folgende Id: laermindex-nacht-strasse-city-50'
            examples:
              - '50'
            $comment: 'Ehemaliges Indexfeld: weight'
          service:
            type: array
            description: Verpflichtend für Datensätze mit WMS Diensten
            items:
              type: object
              properties:
                url:
                  type: string
                  $comment: 'Ehemaliges Indexfeld: wms.url'
                type:
                  type: string
                  enum:
                  - wms
                  - wmts
                  $comment: 'Ehemaliges Indexfeld: wms.type'
                layer:
                  type: array
                  items:
                    type: object
                    properties:
                      legend:
                        type: string
                        $comment: 'Ehemaliges Indexfeld: wms.legend.url'
                      name:
                        type: string
                        description: WMS Layername
                      title:
                        type: string
                        description: Display Title
                    required:
                    - name
                    $comment: 'Ehemaliges Indexfeld: wms.layer'
                  minItems: 1
              required:
              - url
              - type
              - layer
            minItems: 1
          info_text:
            type: string
            $comment: 'Ehemaliges Indexfeld: info'
          icon:
            type: string
          license:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
            required:
            - name
          owner:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
            required:
            - name
          contact:
            type: string
            description: Adresse des Objekts
            examples:
            - 'Hanauer Landstr. 52, 60314 Frankfurt'
            - 'Ansprechpartner: Frank Kruse'
            $comment: 'Ehemaliges Indexfeld: address'
          metadata_url:
            type: string
            description: Referenz zu externem Metadatensatz
            $comment: 'Ehemaliges Indexfeld: meta_data_url'
          content_items:
            type: array
            items:
              properties:
                name:
                  type: string
                  description: Name des Inhaltsbereichs
                  examples:
                  - 'Bilder, Beschreibung, Wikipedia, Steckbrief'
                items:
                  allOf:
                    - type: object
                      title: Basisinformationen
                      required:
                        - type
                      description: Liste der Inhalte
                      properties:
                        type:
                          type: string
                          enum:
                            - image
                            - text
                            - link
                        url:
                          type: string
                          description: Für Link und Bild
                        title:
                          type: string
                          description: Titel des Elementes
                        content:
                          type: string
                          description: Angaben zur Herkunft des Inhalts
                          $comment: 'Ehemaliges Indexfeld: object_date'
                        assigned_to:
                          type: string
                          description: Partner für den das Detail spezifisch erstellt wurde. Leer
                            bedeutet für alle Partner.
                          enum:
                          - ni
                          - sh
                          - rp
                    - $ref: "./parts/shared-types.yaml#/$defs/UmweltNaviSourceAttributes"
                      type: object
              required:
              - name
              - items
            description: Liste der Inhalte zum Objekt unterteilt in Bereiche
            $comment: 'Ehemaliges Indexfeld: data'
          relations:
            type: array
            items:
              properties:
                name:
                  type: string
                  description: Name der Relation
                  examples:
                  - enthält, gehört zu
                items:
                  type: object
                  properties:
                    oid:
                      type: string
                    name:
                      type: string
                  required:
                  - oid
                  - name
              required:
              - name
              - items
          import_ref:
            type: object
            description: 'Enthält Datenbank ID des Objekts (Attribut "original") und ggf. des überschreibenden Objekts (Attribut: "override")'
            properties:
              original:
                type: integer
                description: Datenbank ID des Objekts
              override:
                type: integer
                description: Datenbank ID des überschreibenden Objekts
            examples:
            - { "original": 27900, "override": 1 }
          target_platform:
            type: string
            description: Target des Datensatzes (App oder Portal)
            enum:
            - web
            - app
            - none
          assigned_to:
            type: string
            description: Partner für den der Datensatz spezifisch erstellt wurde. Leer bedeutet für alle Partner.
            enum:
            - ni
            - sh
            - rp
            - none
          tags:
            type: array
            items:
              type: string
              examples:
              - 'spatial-object, map-service '
            minItems: 0
          indexed_terms:
            type: array
            items:
              type: string
              description: Für Volltextsuche, enthält Kategorienamen und Namen von Sammlungen, Statistiken etc für separate Gewichtung von fulltext
            minItems: 0
          statistics:
            type: array
            items:
              type: object
              properties:
                oid:
                  type: string
                  description: Eindeutige ID der Statistik
                  examples:
                  - 'bevoelkerungsentwicklung-bis-2021-bkg-vg250-gemeinden-10046118 '
                name:
                  type: string
                  description: Name der Statistik
                  examples:
                  - 'Bevölkerungsentwicklung bis 2021 '
                category:
                  type: object
                  properties:
                    name:
                      type: string
                      examples:
                      - Bevölkerungsentwicklung
                    slug:
                      type: string
                      examples:
                      - bevoelkerungsentwicklung
                  required:
                  - name
                  - slug
                  description: Kategorie im BIPU Datenmodell, wird für die Suche verwendet, damit nach Statistik-Kategorie gesucht werden kann.
                source:
                  type: string
                  description: Beschreibt Statistik (Herkunft)
                info_text:
                  type: string
                property:
                  type: string
                  examples:
                  - Bodenversiegelung [%]
                unit:
                  type: string
                  examples:
                  - '%'
                values:
                  type: array
                  items:
                    properties:
                      display_date:
                        type: string
                        description: Zeitwert für die Anzeige im Diagramm
                        $comment: 'Ehemaliges Indexfeld: time'
                      value:
                        type: string
                        description: Wert pro Zeitwert
                    required:
                    - display_date
                    - value
                license:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                  required:
                  - name
                owner:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                  required:
                  - name
                temporal:
                  $ref: "./parts/shared-types.yaml#/$defs/TypedPeriodOfTime"
                  description: Datum der Erhebung der Statistik
                  $comment: 'Ehemaliges Indexfeld: object_date'
                import_ref:
                  type: object
                  properties:
                    original:
                      type: integer
                      description: enthält Datenbank ID der Statistik
              required:
              - oid
              - name
              - property
              - unit
              - values
              - import_ref
              description: Statistiken, die einem Objekt zugeordnet sind. Z.B. Einwohnerzahlen, Flächenversiegelung über mehrere Jahre
              $comment: 'Ehemaliges Indexfeld: properties.statistics'
            minItems: 0
          collections:
            type: array
            items:
              type: object
              properties:
                oid:
                  type: string
                  description: Eindeutige ID der Sammlung
                  examples:
                  - Arten-bfn-ffh-de4622302
                name:
                  type: string
                  description: Name der Sammlung
                  examples:
                  - Arten
                category:
                  type: object
                  properties:
                    name:
                      type: string
                      examples:
                      - 'Bevölkerungsentwicklung '
                    slug:
                      type: string
                      examples:
                      - 'bevoelkerungsentwicklung '
                  required:
                  - name
                  - slug
                  description: Kategorie im BIPU Datenmodell, wird für die Suche verwendet,
                    damit nach Sammlungs-Kategorie gesucht werden kann.
                source:
                  type: string
                  description: Beschreibt Sammlung (Herkunft)
                info_text:
                  type: string
                url:
                  type: string
                  description: URL zu einer Sammlung, z.B. zu den Arten eines Naturschutzgebietes in observation.org
                groups:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name der Artengruppe
                      url:
                        type: string
                        description: URL, z.B. für Artengruppenanzeige eines Naturschutzgebietes auf observation.org
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            url:
                              type: string
                            temporal:
                              $ref: "./parts/shared-types.yaml#/$defs/TypedPeriodOfTime"
                              description: Fund, Beobachtung in Observation.org
                              $comment: 'Ehemaliges Indexfeld: object_date'
                            image:
                              $ref: "./parts/shared-types.yaml#/$defs/UmweltNaviImage"
                          required:
                          - name
                        minItems: 0
                    required:
                    - name
                    description: z.B. eine Artengruppen
                  minItems: 0
                license:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                  required:
                  - name
                owner:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                  required:
                  - name
                temporal:
                  type: string
                  description: Datum der Erhebung der Statistik
                  $comment: 'Ehemaliges Indexfeld: object_date'
                import_ref:
                  type: object
                  properties:
                    original:
                      type: integer
                      description: enthält Datenbank ID der collection
              required:
              - oid
              - name
              - import_ref
              description: z.B. Beobachtete Arten in einem Naturschutzgebiet
              $comment: 'Ehemaliges Indexfeld: properties.collections'
            minItems: 0
          sensor:
            type: object
            properties:
              measurements:
                type: array
                title: Messwertequellen
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Anzeigename der Messreihe
                      examples:
                        - Luftqualitätsindex
                    unit:
                      type: string
                      description: Einheit der Messreihe
                      examples:
                        - Index [1-6]
                    property:
                      type: string
                      description: technischer Name der Messreihe, wird in API zu einem Datastream im STA server aufgelöst (entspricht datasources.id)
                      examples:
                        - LQI
                    resolutions:
                      type: object
                      description: Zeitliche Auflösungen der Messreihe zusammen mit Messwerttyp. Hier werden die unterschiedlichen Messwerttypen als dynamische Properties eingetragen. Jeder Messwerttyp hat dabei eine Liste von Auflösungen.
                      examples:
                        - P1M: [MEAN, MIN, MAX]
                    interface:
                      type: string
                      description: Name des Interfaces über das die Messreihe abgerufen wird
                      examples:
                        - sta
                    url:
                      type: string
                      description: Sensor-URL (kann zukünftig entfallen, wenn z.B. LQI als Datastream vorliegt und nicht berechnet werden muss)
                    datasource:
                      type: array
                      title: Datenquelle
                      items:
                        type: object
                        properties:
                          url:
                            type: string
                            title: Datastream-URL
                          type:
                            type: string
                            title: Messwerttyp
                            examples:
                              - MEAN
                          resolution:
                            type: string
                            title: Messwerttyp
                            examples:
                              - P1M
        allOf:
          - if:
              properties:
                metadata:
                  properties:
                    document_type:
                      const: object
              required:
                - type
            then:
              required:
                - source_id
          - if:
              properties:
                metadata:
                  properties:
                    document_type:
                      const: map
              required:
                - type
            then:
              required:
                - origin
                - classification
        required:
        - oid
        - part
        - category
        - import_ref
    required:
      - metadata
