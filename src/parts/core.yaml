$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: Root fields
properties:
  id:
    type: string
    description: | 
      The ID of the Dataset. The ID **must** be unique in the index.
    examples:
    - Für UMWELTNAVI <oid>-<part> i.e. 'nlwkn-dsk-4922-21000-0'
    - For InGrid Editor i.e. 'd43dad1f-a19f-4043-bca4-447cf5e7cabb'
  schema_version:
    type: string
    description: | 
      Die Version des Schemas des Indexes. 
      Die Version richtet sich nach der Versionierung des InGrid Releases. 
      Semantic Versioning soll verwendet werden.
      Zusätzlich kann eine Schema- Release-Nummer verwendet werden, z.B. 1.0.0-1
    examples:
    - 1.0.0
    - 1.1.0-1
    - 1.2.0-1
  metadata:
    description: Enthält Metadaten über den Datensatz. Dies kann das Erstellungs- oder Änderungsdatum sein, oder aus welcher Quelle der Datensatz stammt.
    $ref: "#/$defs/Metadata"
  sort_uuid:
    description: Sortier-UUID für die Sortierung von Datensätzen, die bei einer leeren Suche durchmischt angezeigt werden sollen.
    type: string
  title:
    type: string
    description: | 
      Der Titel des Datensatzes.
  description:
    description: | 
      Die Beschreibung des Datensatzes.
    type: string
  language:
    type: string
    description: Welches Format hat die Sprache, wo wird es verwendet.
  contacts:
    type: array
    items:
      properties:
        role:
          type: string
        name:
          type: string
        communications:
          type: array
          items:
            properties:
              type:
                type: string
                enum: [ email, phone, fax, website, social, other ]
              value:
                type: string
        street:
          type: string
        code:
          type: string
        pocode:
          type: string
        pobox:
          type: string
        locality:
          type: string
        country:
          type: string
        administrative_area:
          type: string
  spatials:
    type: array
    description: "Dieser Bereich enthält Informationen über den Raumbezug."
    items:
      type: object
      $ref: "#/$defs/SpatialItem"
    $comment: 'Ehemaliges Indexfeld: layer'
  temporal:
    description: Gültigkeitsdatumsbereich der beschriebenen Daten
    $ref: ./shared-types.yaml#/$defs/Temporal
    $comment: 'Ehemaliges Indexfeld: object_date'
  keywords:
    type: array
    items:
      type: object
      title: item
      properties:
        term:
          type: string
          description: 'Name des Keywords'
        id:
          type: string
          description: Eindeutiger Identifier des Keywords bezüglich der Quelle oder
            auch  URL-freundliche Form des Keywords (Slug)
          examples:
          - 'wk000680'
        source:
          type: string
          description: Quelle des Keywords
          examples:
            - gemet
            - umthes
            - iso_topic
      required:
      - term
      - source
  fulltext:
    type: array
    description: Für Full Text Suche. Signifikanz von genauen Treffern kann hier geboostet
      werden. Entsprechende Felder sollten mit copy_to-Operation in Elasticsearch kopiert werden.
    $comment: Früher content-Feld
    items:
      type: string
  exports:
    type: object
    description: Hier werden die zusätzlichen Export-Formate gehalten, die mit dem Datensatz ausgeliefert
      werden. Die Export-Formate können z.B. CSV, JSON oder andere Formate sein.
required:
- id
- schema_version
- metadata
- title
$defs:
  SpatialItem:
    title: Spatial Core
    type: object
    properties:
      name:
        type: string
        description: Kann einen Namen oder eine ID gür eine Geometrie enthalten.
        examples:
          - <oid>-<geometrie-id> (für UMWELTNAVI)
      geometry:
        type: object
        description: 'Enthält die GeoJSON-Repräsentation, die für eine optimierte Suche benötigt wird. Siehe auch https://de.wikipedia.org/wiki/GeoJSON'
        properties:
          type:
            type: string
            enum:
              - Point
              - LineString
              - Polygon
              - MultiPoint
              - MultiLineString
              - MultiPolygon
          coordinates:
            type: array
            items:
              type: array
              minItems: 4
              items:
                type: array
                minItems: 2
                items:
                  type: number
            description: 'Koordinaten des Geometrieelements'
            examples:
              - '...'
      bbox:
        type: array
        title: Bounding Box
        description: Umschließende BBOX der Geometrie
        items:
          type: number
          minimum: -180
          maximum: 180
          minItems: 4
          maxItems: 4
      wkt:
        type: string
        title: Well-known text
        description: Angabe eines Well-known text-Formats.
      toponym:
        type: array
        title: Toponym
        items:
          type: string
          description: Textueller Raumbezug (wie Stadtnamen oder Flussnamen)
          examples:
            - Frankfurt am Main
            - Hamburg
        minItems: 0
      administrative:
        type: object
        properties:
          state:
            type: array
            items:
              type: string
              description: Land (z.B. ni, sh, rp)
            minItems: 0
          regional_key:
            type: string
        description: Administrative Zuordnung
    anyOf:
      - required: [ "bbox" ]
      - required: [ "wkt" ]
      - required: [ "toponym" ]
  Metadata:
    type: object
    properties:
      data_type:
        type: string
        description: |
          Beschreibt den Typ des Metadatensatzes im Index. Jeder Eintrag beschreibt eine bestimmte Eigenschaft des Datensatzes. Die Eigenschaften z.B. im Portal verwendet, um eine bestimmte Darstellung des Metadatensatzes zu steuern. Der Wert muss vom Profil bestimmt werden.
        examples:
          - UmweltNAVI Datensatz ['UMWELTNAVI']
          - InGrid Datensatz ['INGRID']
          - UVP Datensatz ['UVP']
      created:
        type: [ "string", "null" ]
        format: date-time
        description: |
          Das Datum der Erstellung des Metadatensatzes. ISO 8601 Format.
        examples:
          - '2026-04-22T12:00:00Z'
          - '2026-04-22T12:00:00+01:00'
      modified:
        type: [ "string", "null" ]
        format: date-time
        description: |
          Das Datum der letzten Änderung des Metadatensatzes. ISO 8601 Format.
        examples:
          - '2026-04-22T12:00:00Z'
          - '2026-04-22T12:00:00+01:00'
      issued:
        type: [ "string", "null" ]
        format: date-time
        description: |
          Das Datum der ersten Veröffentlichung des Metadatensatzes. ISO 8601 Format.
      partner:
        type: string
        description: |
          Der Partner der Datenquelle als Kürzel. Siehe auch Codeliste 110.
        examples:
          - bb
          - st
      provider:
        type: string
        description: |
          Der Anbieter der Datenquelle als Kürzel. Siehe auch Codeliste 111.
        examples:
          - ni_gll
          - bw_mj
      language:
        title: language
        description: "Enthält die Sprache des Metadatensatzes. Hier wird die Codeliste 99999999 verwendet."
        $ref: ./shared-types.yaml#/$defs/KeyValue
      datasource:
        properties:
          id:
            type: string
            description: Die ID der Datenquelle.
          name:
            type: string
            description: Der Name der Datenquelle.
    required:
      - data_type
      - created
      - modified
