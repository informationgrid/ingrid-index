$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: Root fields
properties:
  id:
    type: string
    description: | 
      The ID of the Dataset. The ID **must** be unique in the index.
    examples:
    - Für UMWELTNAVI <oid>-<part> i.e. 'nlwkn-dsk-4922-21000-0'
    - For InGrid Editor i.e. 'd43dad1f-a19f-4043-bca4-447cf5e7cabb'
  schema_version:
    type: string
    description: | 
      Die Version des Schemas des Indexes. 
      Die Version richtet sich nach der Versionierung des InGrid Releases. 
      Semantic Versioning soll verwendet werden.
      Zusätzlich kann eine Schema- Release-Nummer verwendet werden, z.B. 1.0.0-1
    examples:
    - 1.0.0
    - 1.1.0-1
    - 1.2.0-1
  type:
    type: string
    deprecated: true
    enum:
    - UMWELTNAVI
    - UMWELTNAVI_SUB_GEOMETRY
  metadata:
    type: object
    properties:
      data_type:
        type: array
        description: | 
          Beschreibt den Typ des Metadatensatzes im Index. Jeder Eintrag beschreibt eine bestimmte Eigenschaft des DatenMetadatensatzessatzes. Die Eigenschaften z.B. im Portal verwendet, um eine bestimmte Darstellung des Metadatensatzes zu steuern.
        items:
            type: string
        examples:
        - UmweltNAVI Datensatz ['UMWELTNAVI']
        - Opendata Datensatz  ['DCAT-AP', 'DCAT-AP.DE']
        - Geometadatensatz ['GEOMETADATA']
        - LVR Datensatz ['LVR']
        enum:
        - DCAT-AP?
        - DCAT-AP.DE?
        - GEOMETADATA?
        - LVR?
        - UMWELTNAVI
        - INGRID
        - UVP
      created:
        type: ["string", "null"]
        format: date-time
        description: | 
          Das Datum der Erstellung des Metadatensatzes. ISO 8601 Format.
        examples:
        - '2026-04-22T12:00:00Z'
        - '2026-04-22T12:00:00+01:00'
      modified:
        type: ["string", "null"]
        format: date-time
        description: | 
          Das Datum der letzten Änderung des Metadatensatzes. ISO 8601 Format.
        examples:
        - '2026-04-22T12:00:00Z'
        - '2026-04-22T12:00:00+01:00'
      issued:
        type: ["string", "null"]
        format: date-time
        description: | 
          Das Datum der ersten Veröffentlichung des Metadatensatzes. ISO 8601 Format.
      partner:
        type: string
        description: | 
          Der Partner der Datenquelle.
      provider:
        type: string
        description: | 
          Der Anbieter der Datenquelle.
      datasource:
        properties:
          id:
            type: string
            description: Die ID der Datenquelle.
          name:
            type: string
            description: Der Name der Datenquelle.
    required:
    - data_type
    - created
    - modified
  title:
    type: string
    description: | 
      Der Titel des Datensatzes.
  description:
    description: | 
      Die Beschreibung des Datensatzes.
    type: string
  spatial:
    type: object
    properties:
      geometry:
        type: object
        description: 'Wie in GeoJSON: https://de.wikipedia.org/wiki/GeoJSON'
        properties:
          type:
            type: string
            enum:
            - Point
            - LineString
            - Polygon
            - MultiPoint
            - MultiLineString
            - MultiPolygon
          coordinates:
            type: array
            items:
              type: array
              minItems: 4
              items:
                type: array
                minItems: 2
                items:
                  type: number
            description : 'Koordinaten des Geometrieelements'
            examples:
              - '...'

      geometries:
        type: array
        deprecated: true
        items:
          type: string
          description: "ergänzt nach Besprechung mit jm und aw"
          $comment: 'Ehemaliges Indexfeld: location'
        minItems: 0
      bbox:
        type: string
        description: Umschließende BBOX der Geometrie
      centroid:
        type: string
        description: Schwerpunkt der Geometrie
      inside_point:
        type: string
        description: Punkt innerhalb der Geometrie, der dem Schwerpunkt am nächsten
          liegt.
      geometry_points:
        type: string
        description: Geometrie als Punkte, wird für Distanz Berechnung verwendet (geo_distance
          Sortierung funktioniert nicht mit geo_shape)
        $comment: 'Ehemaliges Indexfeld: location_points'
      outline:
        type: array
        items:
          type: string
          description: Outline für die Darstellung, ggf. reduzierte Geometrie
        minItems: 0
      title:
        type: string
        description: Für UMWELTNAVI <oid>-<geometrie-id>
      toponym:
        type: array
        items:
          type: string
          description: Textueller Raumbezug (wie Stadtnamen oder Flussnamen)
          examples:
            - Frankfurt am Main
            - Hamburg
        minItems: 0
      administrative:
        type: object
        properties:
          state:
            type: array
            items:
              type: string
              description: Land (z.B. ni, sh, rp)
            minItems: 0
          regional-key:
            type: string
        description: Administrative Zuordnung
    $comment: 'Ehemaliges Indexfeld: layer'
  issued:
    type: string
  temporal:
    type: object
    properties:
      data-temporal:
        $ref: "./shared-types.yaml#/$defs/TypedPeriodOfTime"
    description: Gültigkeitsdatumsbereich der beschriebenen Daten
    $comment: 'Ehemaliges Indexfeld: object_date'
  keywords:
    type: array
    items:
      type: object
      properties:
        term:
          type: string
          description: 'Keyword '
        id:
          type: string
          description: Eindeutiger Identifier des Keywords bezüglich der Quelle oder
            auch  URL-freundliche Form des Keywords (Slug)
          examples:
          - 'wk000680 '
        source:
          type: string
      required:
      - term
    minItems: 0
  fulltext:
    type: string
    description: Für Full Text Suche. Signifikanz von genauen Treffern kann hier geboostet
      werden.
  content:
    type: array
    deprecated: true
    $comment: Es sollte jetzt fulltext verwendet werden.
    items:
      type: string
  sort_uuid:
    type: string
  language:
    type: string
  format:
    type: string
  contacts:
    type: array
    items:
      properties:
        role:
          type: string
        name:
          type: string
        communications:
          type: array
          items:
            properties:
              type:
                type: string
              value:
                type: string
        street:
          type: string
        code:
          type: string
        pocode:
          type: string
        pobox:
          type: string
        locality:
          type: string
        country:
          type: string
        administrative_area:
          type: string
  collection: {
    type: "object",
    title: "collection",
    properties: {
      id: {
        type: "string"
      },
      name: {
        type: "string"
      }
    }
  }
required:
- id
- schema_version
- metadata
- title
- fulltext
