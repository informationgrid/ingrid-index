$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.com/schemas/1.0.0/dcat.yaml
title: Schema for InGrid Index 'InGrid'
type: object
allOf:
  - $ref: ./parts/core.yaml
  - type: object
    title: InGrid
    properties:

      exports:
        properties:
          iso:
            type: string
            description: "Enthält das vollständige ISO-19139-Dokument im XML-Format."

      ingrid:
        properties:

          # portal specific

          # CORE

          # - Titel (c)
          # - Tags, wie OpenData (c)
          # - ansprechpartner (c)
          #   - Erstellung (c)
          #   - Publikation (c)
          #   - Letzte Änderung (c)
          # - Raumbezug (c)
          # - Koordinatensystem (c)
          # - Kontakte (c)
          # - Schlagworte (c)
          #   - UUID (c)
          #   - Aktualität (c?)

          # PROFILE

          # Kurzbezeichnung
          alternate_title:
            type: string

          # - Typ (metadata.type)
          # - Informationen zum Metadatensatz
          #   - Sprache
          #   - Datensatz/serie
          #   - ISO-XML - Link (im Portal generiert - CSW-Schnittstelle)
          #   - Ansprechpartner (Metadatum)
          #   - Quelle
          metadata:
            properties:
              type:
                type: string
                enum:
                  - InGridGeoDataset
                  - InGridDataCollection
                  - InGridGeoService
                  - InGridInformationSystem
                  - InGridPublication
                  - InGridProject
                  - InGridSpecialisedTask
              language:
                title: language
                properties:
                  key:
                    type: string
                  value:
                    type: string
              character_set:
                description: "Aktuell nicht im Portal angezeigt?"
                deprecated: true
                properties:
                  key:
                    type: string
                  value:
                    type: string


          # - downloads (references)
          # - vorschaubilder (references)
          # - Verweise und Downloads (references)
          references:
            type: array
            items:
              type: object
              title: item
              properties:
                url:
                  type: string
                type:
                  type: object
                  title: type
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    _codelistId:
                      type: string
                title:
                  type: string
                explanation:
                  type: string
                reference_type:
                  type: string
          # - nutzungsbedingungen (licenses)
          # - Nutzungsbedingungen (licenses)
          # - Anwendungseinschränkungen (licenses)
          # access- and use-constraints and use limitations
          licenses:
            type: array
            items:
              type: object
              title: item
              properties:
                type:
                  type: string
                  enum:
                    - accessConstraints
                    - useConstraints
                    - useLimitations
                items:
                  type: array
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
          # - Aktualität des Datensatzes
          #   - Status (temporal.status)
          #   - Pflegeintervall (temporal.maintenanceFrequency)
          #   - Benutzerdefiniertes Pflegeintervall (temporal.userDefinedMaintenanceFrequency)
          temporal:
            properties:
              status:
                type: string
              maintenance_frequency:
                type: string
              user_defined_maintenance_frequency:
                type: string
          # - Identifikator des übergeordneten Datensatzes (parentIdentifier)
          parent_identifier:
            type: string
          # - Fachinformationen
          #   - Identifikator der Datenquelle (datasourceIdentifier)
          datasource_identifier:
            type: string
          #   - Digitale Repräsentation
          spatial_representation:
            type: array
            items:
              properties:
                type:
                  type: string
                  enum:
                    - text
                    - vector
                    - tin
                    - video
                    - stereomodel
                    - grid
                vector:
                  type: array
                  items:
                    properties:
                      topology:
                        type: string
                      geometry_type:
                        type: string
                      number:
                        type: integer
                grid:
                  description: "Aktuell nicht im Portal angezeigt?"
                  properties:
                    axes:
                      type: array
                      items:
                        properties:
                          label:
                            type: string
                          number:
                            type: integer
                          resolution:
                            type: integer
                    available_parameters:
                      type: boolean
                    number_dimensions:
                      type: integer
                    cell_geometry:
                      type: string
                    rectified:
                      properties:
                        TODO:
                          type: boolean
                    referenced:
                      properties:
                        TODO:
                          type: boolean

          #   - ...
          # - Zusatzinformationen
          #   - Eignung
          specific_usage:
            type: string
          #   - Herstellungszweck
          purpose:
            type: string
          #   - Sprache
          language:
            type: string
          #   - Konformität
          conformance_result:
            type: array
            items:
              title: item
              properties:
                pass:
                  type: string
                  enum:
                    - conform
                    - not-conform
                    - not-evaluated
                specification:
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                publicationDate:
                  type: string
                explanation:
                  type: string

          #   - Bestellinformationen
          order_info:
            type: string




          # TODO: merge references and fileReferences
          # TODO: properties to tags (core?)
          # TODO: parentIdentifier (core?)

